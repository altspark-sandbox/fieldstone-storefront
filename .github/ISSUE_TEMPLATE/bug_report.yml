name: Bug report
description: Something on the storefront is broken
labels: ["type: bug", "needs triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Catalog, Cart, Checkout, Quotes, Accounts]
